<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>Responsive Document Viewer</title>

  <style>

    html, body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      font-family: sans-serif;

      background: #f9f9f9;

      box-sizing: border-box;

    }



    #viewer-container {

      width: 360px;

      height: 261px;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #fff;

      margin: auto;

    }



    canvas, img {

      display: block;

      max-width: 100%;

      max-height: 100%;

      object-fit: contain;

      image-rendering: auto;

      image-rendering: crisp-edges;

      image-rendering: pixelated;

    }

  </style>



  <!-- PDF.js -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>

</head>

<body>

  <div id="viewer-container">

    <canvas id="pdf-canvas" style="display: none;"></canvas>

    <img id="image-viewer" style="display: none;" />

  </div>



  <script>

    function getQueryParam(param) {

      const urlParams = new URLSearchParams(window.location.search);

      return urlParams.get(param);

    }



    const fileUrl = getQueryParam('file');

    if (!fileUrl) {

      document.body.innerHTML = "<p style='color:red;text-align:center;'>No file specified. Use ?file=yourfile.pdf or .png</p>";

      throw new Error("No file specified");

    }



    const isPDF = fileUrl.toLowerCase().endsWith('.pdf');

    const canvas = document.getElementById('pdf-canvas');

    const ctx = canvas.getContext('2d');

    const imageViewer = document.getElementById('image-viewer');

    const container = document.getElementById('viewer-container');



    if (isPDF) {

      canvas.style.display = 'block';

      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';



      let pdfDoc = null;

      let pageNum = 1;



      function renderPage() {

        pdfDoc.getPage(pageNum).then(page => {

          const containerWidth = 360;

          const containerHeight = 261;

          const devicePixelRatio = window.devicePixelRatio || 1;



          const viewportUnscaled = page.getViewport({ scale: 1 });

          const pdfWidth = viewportUnscaled.width;

          const pdfHeight = viewportUnscaled.height;



          const widthScale = containerWidth / pdfWidth;

          const heightScale = containerHeight / pdfHeight;

          const scale = Math.min(widthScale, heightScale);



          const scaledViewport = page.getViewport({ scale: scale * devicePixelRatio });



          canvas.width = Math.floor(scaledViewport.width);

          canvas.height = Math.floor(scaledViewport.height);

          canvas.style.width = `${containerWidth}px`;

          canvas.style.height = `${containerHeight}px`;



          const renderContext = {

            canvasContext: ctx,

            viewport: scaledViewport

          };



          page.render(renderContext);

        });

      }



      pdfjsLib.getDocument(fileUrl).promise.then(doc => {

        pdfDoc = doc;

        renderPage();

      });



      window.addEventListener('resize', renderPage);

    } else {

      imageViewer.style.display = 'block';

      imageViewer.src = fileUrl;

      imageViewer.alt = 'Document Image';

    }

  </script>

</body>

</html>
